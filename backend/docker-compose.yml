services:
  postgres:
    image: postgres:15-alpine
    container_name: dailytrack-postgres
    environment:
      POSTGRES_USER: dailytrack
      POSTGRES_PASSWORD: dailytrackpass
      POSTGRES_DB: dailytrackdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  chroma:
    image: chromadb/chroma:latest
    container_name: dailytrack-chroma
    volumes:
      - chromadata:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    ports:
      - "8000:8000"

  backend:
    build: .
    container_name: dailytrack-backend
    depends_on:
      - postgres
      - chroma
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: dailytrack
      DB_PASSWORD: dailytrackpass
      DB_NAME: dailytrackdb
      DB_PORT: 5432
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: dailytrack-nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
  chromadata:
